name: action

on:
  pull_request:
    paths: ['action.yml', 'setup/**', 'scripts/action-build.sh', 'cmd/zapp/**', 'pkg/appbundle/**', 'pkg/archive/**', 'pkg/macfs/**', 'pkg/macho/**', 'pkg/upload/**', '.github/workflows/action.yaml', '.github/scripts/put-server.py']
  push:
    paths: ['action.yml', 'setup/**', 'scripts/action-build.sh', 'cmd/zapp/**', 'pkg/appbundle/**', 'pkg/archive/**', 'pkg/macfs/**', 'pkg/macho/**', 'pkg/upload/**', '.github/workflows/action.yaml', '.github/scripts/put-server.py']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Installs a published release, as users of ironpark/zapp/setup get it.
  setup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - id: zapp
        uses: ./setup
        with:
          version: 1.0.0
      - name: Check the installed binary
        shell: bash
        run: |
          test "${{ steps.zapp.outputs.version }}" = 1.0.0
          # 1.0.0's Linux and Windows builds report their tag, with a v.
          # grep -q stops reading early, which pipefail reports as a failure.
          info=$(zapp info)
          grep -Eq 'Version *: *v?1\.0\.0' <<<"$info"
          test -x "${{ steps.zapp.outputs.path }}"

  # Builds a DMG and a PKG through the action with zapp from this checkout.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build zapp
        shell: bash
        run: |
          go build -o "$RUNNER_TEMP/bin/" ./cmd/zapp
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: Test the Windows file modes and links
        if: runner.os == 'Windows'
        shell: bash
        run: go test -count=1 ./pkg/appbundle ./pkg/macfs ./pkg/archive && go test -count=1 -run '^TestWindowsPayloadMetadata$' ./pkg/macpkg
      - name: Make a test app
        shell: bash
        run: |
          app="$RUNNER_TEMP/project/Demo.app/Contents"
          mkdir -p "$app/MacOS" "$app/Resources"
          cp iconfile.icns "$app/Resources/AppIcon.icns"
          printf '#!/bin/sh\n' >"$app/MacOS/Demo"
          cat >"$app/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Demo</string>
            <key>CFBundleExecutable</key><string>Demo</string>
            <key>CFBundleIdentifier</key><string>com.example.demo</string>
            <key>CFBundleShortVersionString</key><string>1.2.3</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
          </dict></plist>
          PLIST
      - name: Start an upload endpoint
        shell: bash
        run: |
          # python3 on Windows runners can be the Microsoft Store stub.
          if [ "$RUNNER_OS" = Windows ]; then py=python; else py=python3; fi
          echo "PY=$py" >>"$GITHUB_ENV"
          "$py" .github/scripts/put-server.py 8765 "$RUNNER_TEMP/received" test-token &
          for _ in $(seq 20); do
            if curl -s -o /dev/null http://127.0.0.1:8765/; then exit 0; fi
            sleep 0.5
          done
          exit 1
      - id: zapp
        uses: ./
        with:
          version: local
          working-directory: ${{ runner.temp }}/project
          app: Demo.app
          steps: dmg pkg
          sign: false
          notarize: false
          zip: true
          checksums: true
          upload-url: http://127.0.0.1:8765/releases/${file.name}?sig=hidden
          upload-headers: |
            Authorization: Bearer test-token
          upload-artifacts: zip dmg checksums
          args: |
            --title=Demo App
      - name: Check the outputs
        shell: bash
        run: |
          test -f "${{ steps.zapp.outputs.dmg }}"
          test -f "${{ steps.zapp.outputs.pkg }}"
          test -f "${{ steps.zapp.outputs.zip }}"
          test -d "${{ steps.zapp.outputs.app }}"
          case "${{ steps.zapp.outputs.dmg }}" in */Demo\ App.dmg) ;; *) exit 1 ;; esac
          test "${{ steps.zapp.outputs.zip-url }}" = http://127.0.0.1:8765/releases/Demo.zip
          test "${{ steps.zapp.outputs.dmg-url }}" = "http://127.0.0.1:8765/releases/Demo%20App.dmg"
          test -z "${{ steps.zapp.outputs.pkg-url }}"
          cmp "${{ steps.zapp.outputs.zip }}" "$RUNNER_TEMP/received/Demo.zip"
          cmp "${{ steps.zapp.outputs.dmg }}" "$RUNNER_TEMP/received/Demo App.dmg"
          test "${{ steps.zapp.outputs.checksums-url }}" = http://127.0.0.1:8765/releases/SHA256SUMS
          cmp "${{ steps.zapp.outputs.checksums }}" "$RUNNER_TEMP/received/SHA256SUMS"
          # Every artifact built is listed, beside it, by its digest.
          (cd "$(dirname "${{ steps.zapp.outputs.checksums }}")" && "$PY" -c 'import hashlib
          lines = open("SHA256SUMS").read().splitlines()
          assert len(lines) == 3, lines
          for line in lines:
              digest, name = line.split("  ", 1)
              assert hashlib.sha256(open(name, "rb").read()).hexdigest() == digest, name')
          # The executable keeps, or on Windows gains, its execute bits.
          "$PY" -c 'import sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          mode = lambda name: z.getinfo(name).external_attr >> 16
          assert mode("Demo.app/Contents/MacOS/Demo") & 0o111, oct(mode("Demo.app/Contents/MacOS/Demo"))
          assert not mode("Demo.app/Contents/Info.plist") & 0o111, oct(mode("Demo.app/Contents/Info.plist"))' "${{ steps.zapp.outputs.zip }}"

name: dmg

on:
  pull_request:
    paths: ['pkg/dmg/**', 'pkg/hfsplus/**', 'pkg/udif/**', 'pkg/alias/**', 'pkg/dsstore/**', 'go.mod', 'go.sum', '.github/workflows/dmg.yaml']
  push:
    paths: ['pkg/dmg/**', 'pkg/hfsplus/**', 'pkg/udif/**', 'pkg/alias/**', 'pkg/dsstore/**', 'go.mod', 'go.sum', '.github/workflows/dmg.yaml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test image generation
        run: go test -count=1 ./pkg/dmg ./pkg/hfsplus ./pkg/udif ./pkg/alias ./pkg/dsstore
      - name: Export a Linux-built image
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/dmg"
          ZAPP_DMG_ARTIFACT_DIR="$RUNNER_TEMP/dmg" go test -count=1 -run '^TestCrossPlatformArtifact$' ./pkg/dmg
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: linux-image
          path: ${{ runner.temp }}/dmg/*.dmg

  linux-artifact-on-macos:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-image
          path: images
      - name: Mount a Linux-generated image with Apple tools
        run: |
          hdiutil verify images/cross-platform.dmg
          hdiutil imageinfo images/cross-platform.dmg | grep -x 'Format: UDZO'
          mkdir mnt
          hdiutil attach images/cross-platform.dmg -mountpoint mnt -nobrowse -readonly
          test "$(cat mnt/Demo.app/Contents/MacOS/Demo)" = '#!/bin/sh'
          test "$(readlink mnt/Applications)" = '/Applications'
          # A framework's links have to survive the trip, not become copies.
          test "$(readlink mnt/Demo.app/Contents/Frameworks/X.framework/X)" = 'Versions/Current/X'
          test -f mnt/.background/background.png
          test -f mnt/.DS_Store
          hdiutil detach mnt

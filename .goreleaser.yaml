# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
    ldflags: '-s -w -X github.com/ironpark/zapp/cmd/info.Version={{.Version}} -X github.com/ironpark/zapp/cmd/info.Commit={{.Commit}} -X github.com/ironpark/zapp/cmd/info.BuildDate={{.Date}}'

release:
  extra_files:
    - glob: release-assets/*

# The Windows and Linux archives are built on their own runners (they link a
# Rust static library through cgo) and assembled by scripts/package-native.py,
# which takes their contents, format and name from the archives block below.
# Listing them here puts them in the same checksums file as everything else.
checksum:
  extra_files:
    - glob: release-assets/*

archives:
  - formats: [tar.gz]
    files:
      - LICENSE*
      - README*
      - CHANGELOG*
      - internal/thirdparty/text/LICENSE
      - internal/thirdparty/text/PATENTS
      - internal/thirdparty/text/README.md
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]

# Homebrew distributes pre-compiled binaries as casks; the old `brews` section
# built a formula instead, and is deprecated. The tap needs a tap_migrations.json
# entry so anyone who installed the formula moves across on their next upgrade.
homebrew_casks:
  - name: zapp
    homepage: "https://github.com/ironpark/zapp"
    description: "Package, sign, and notarize macOS applications"
    repository:
      owner: ironpark
      name: homebrew-zapp
    commit_author:
      name: ironpark
      email: cjfdhksaos@gmail.com
    # Unlike a formula, a cask keeps Homebrew's download quarantined. zapp's own
    # macOS builds are neither signed nor notarized, so without this Gatekeeper
    # refuses to run the installed binary.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/zapp"]
          end
changelog:
  sort: asc
  filters:
    exclude:
      - "^ci:"
      - "^docs:"
      - "^doc:"
      - "^test:"
      - "^build:"
      - "README"

# zapp project schema v1. Copy this to .zapp.yaml at your project root.
# All paths are relative to this file. CLI and ZAPP_* path overrides use cwd.
version: 1
app: ../dist/MyApp.app
out: ../dist

# Presence enables each build step. Remove dep if your app needs no bundling.
dep:
  libs: [/opt/homebrew/lib]

# Uncomment to sign and notarize automatically after packaging.
# Credentials are examples of environment references, never embedded secrets.
# sign:
#   identity: ${env:ZAPP_IDENTITY}
#   # Cross-platform certificate alternatives: p12File or pemFile.
#   # p12File: ${env:ZAPP_P12_FILE}
#   # Set ZAPP_P12_PASSWORD at runtime; p12Password is forbidden here.
# notarize:
#   profile: ${env:ZAPP_PROFILE}
#   # Alternatively: appleId + teamId and runtime ZAPP_PASSWORD,
#   # or apiKeyFile: ${env:ASC_API_KEY}
#   staple: true

dmg:
  title: ${app.name}
  out: ../dist/${app.name}-${app.version}.dmg
  fs: hfsplus
  format: udzo
  window: {width: 720, height: 460}
  iconSize: 96
  labelSize: 14
  # icon: assets/icon.png
  # background: assets/background.png
  # Omit contents for an automatically positioned app + /Applications layout.
  contents:
    ${app}: {x: 180, y: 200}
    /Applications: {link: true, x: 540, y: 200}
    ../README.md: {name: Read Me.md, x: 360, y: 350}

# Short form: identifier and version default from the app's Info.plist.
pkg:
  type: product
  installLocation: /Applications
  # scripts: installer/scripts
  # minOS: '12.0'
  # license: installer/license.txt
  # Or localized licenses:
  # license: {default: installer/license.txt, ko: installer/license-ko.txt}

